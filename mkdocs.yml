site_name: power-git Documentation
site_description: A fast, feature-rich Git prompt and tab-completion module for PowerShell 5.1+
site_author: Eniel Rodriguez
site_url: https://enielrodriguez.github.io/power-git/
repo_name: enielrodriguez/power-git
repo_url: https://github.com/enielrodriguez/power-git

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Themes & Styling: themes.md
  - Tab Completion: tab-completion.md
  - Architecture: architecture.md
  - Troubleshooting: troubleshooting.md
